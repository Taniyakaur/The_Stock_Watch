{% extends "watchlist/base.html" %}

{% block content %}
<div class="layout">
  <aside class="card">
    <h2>Your watchlists</h2>
    <ul class="lists" id="lists"></ul>
    <form id="new-list">
      <input id="new-list-name" placeholder="New list name, e.g. Tech" required maxlength="100">
      <button class="btn">Create</button>
    </form>
    <button class="btn ghost example-btn" id="add-example">+ Add a list of popular stocks</button>
  </aside>

  <main class="card" id="main"></main>
</div>
{% endblock %}

{% block scripts %}
<script>
const API = "/api";
let lists = [];
let currentId = null;
let detail = null;  // the stock whose big chart is open: {stockId, symbol, name, target, range}

function csrf() {
  const m = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}

async function api(path, options = {}) {
  const resp = await fetch(API + path, {
    ...options,
    headers: { "Content-Type": "application/json", "X-CSRFToken": csrf(), ...(options.headers || {}) },
  });
  if (resp.status === 401 || resp.status === 403) {
    window.location.href = "/login/?next=/";  // logged out (e.g. session expired)
    throw new Error("Please log in again.");
  }
  const data = resp.status === 204 ? null : await resp.json().catch(() => null);
  if (!resp.ok) throw new Error(errorText(data) || `Something went wrong (${resp.status}).`);
  return data;
}

function errorText(data) {
  if (!data) return "";
  if (typeof data === "string") return data;
  if (data.detail) return data.detail;
  return Object.entries(data).map(([field, msgs]) => {
    const text = [].concat(msgs).join(" ");
    return field === "non_field_errors" ? text : `${field.replace("_", " ")}: ${text}`;
  }).join(" ");
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}

function money(v) {
  return v == null ? "—" : "$" + Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

let flash = null;
function setFlash(text, kind = "error") { flash = { text, kind }; }

async function loadLists() {
  lists = [];
  let url = "/watchlists/";
  while (url) {
    const page = await api(url);
    lists.push(...page.results);
    url = page.next ? page.next.slice(page.next.indexOf(API) + API.length) : null;
  }
  lists.sort((a, b) => a.name.localeCompare(b.name));
  if (!lists.some(l => l.id === currentId)) currentId = lists.length ? lists[0].id : null;
  renderLists();
}

function renderLists() {
  const ul = document.getElementById("lists");
  ul.replaceChildren(...lists.map(l => el("li", {},
    el("button", { class: l.id === currentId ? "active" : "", onclick: () => select(l.id) },
      el("span", {}, l.name), el("span", { class: "count" }, String(l.items.length))))));
  if (!lists.length) ul.append(el("li", { class: "hint" }, "No lists yet — create your first one below."));
}

async function select(id) {
  if (id !== currentId) detail = null;
  currentId = id;
  renderLists();
  await renderMain();
}

async function renderMain() {
  const main = document.getElementById("main");
  const msg = flash ? el("div", { class: "msg " + flash.kind }, flash.text) : null;
  flash = null;

  if (currentId == null) {
    main.replaceChildren(msg || "", el("div", { class: "empty" },
      el("p", {}, "Start by creating a watchlist on the left."),
      el("p", { class: "hint" }, "A watchlist is just a named group of stocks, like “Tech” or “Long term”."),
      el("p", {}, el("button", { class: "btn", onclick: addExample }, "Or start with 10 popular stocks"))));
    return;
  }

  const wl = await api(`/watchlists/${currentId}/`);
  const idx = lists.findIndex(l => l.id === wl.id);
  if (idx >= 0) { lists[idx] = wl; renderLists(); }

  const addForm = el("form", { class: "add", onsubmit: e => addStock(e, wl.id) },
    el("input", { name: "symbol", placeholder: "Stock symbol, e.g. AAPL", required: "", maxlength: "10" }),
    el("input", { name: "target", placeholder: "Target price (optional)", type: "number", step: "0.01", min: "0" }),
    el("input", { name: "notes", placeholder: "Note (optional)" }),
    el("button", { class: "btn" }, "Add stock"));

  let body;
  if (!wl.items.length) {
    body = el("div", { class: "empty" },
      el("p", {}, "This list is empty."),
      el("p", { class: "hint" }, "Type a stock symbol above (like AAPL for Apple or TSLA for Tesla) and press “Add stock”."));
  } else {
    const items = [...wl.items].sort((a, b) => a.stock_detail.symbol.localeCompare(b.stock_detail.symbol));
    body = el("div", { class: "table-wrap" }, el("table", {},
      el("thead", {}, el("tr", {},
        el("th", {}, "Stock"), el("th", { class: "num" }, "Price"), el("th", { class: "num" }, "Today"),
        el("th", {}, "30 days"),
        el("th", { class: "num" }, "Target"), el("th", {}, "Status"), el("th", {}, ""))),
      el("tbody", {}, ...items.map(itemRow))));
  }

  main.replaceChildren(
    msg || "",
    el("div", { class: "main-head" },
      el("h2", {}, wl.name),
      el("button", { class: "btn ghost", onclick: () => deleteList(wl) }, "Delete list")),
    addForm, body,
    el("div", { id: "detail" }),
    el("p", { class: "foot" }, "Prices refresh every minute. “Today” is the change since yesterday’s close. Click a symbol to see its chart. You’ll get an email when a stock reaches your target."));

  if (detail) {
    const item = wl.items.find(i => i.stock === detail.stockId);
    if (item) { detail.target = item.target_price; renderDetail(); } else detail = null;
  }
}

function itemRow(item) {
  const s = item.stock_detail;
  const change = s.day_change_pct;
  const changeCell = change == null ? el("td", { class: "num" }, "—")
    : el("td", { class: "num " + (Number(change) >= 0 ? "up" : "down") },
        (Number(change) >= 0 ? "▲ +" : "▼ ") + Number(change).toFixed(2) + "%");

  let status;
  if (s.current_price == null) status = el("span", { class: "badge na", title: "Check that the symbol is spelled correctly." }, "No price found");
  else if (item.target_price == null) status = el("span", { class: "badge wait" }, "No target set");
  else if (item.target_reached) status = el("span", {
    class: "badge hit",
    title: item.alert_sent_at ? "Alert emailed " + new Date(item.alert_sent_at).toLocaleString() : "An alert email will be sent shortly.",
  }, item.alert_sent_at ? "✓ Target reached · emailed" : "✓ Target reached");
  else {
    const gap = (Number(item.target_price) / Number(s.current_price) - 1) * 100;
    status = el("span", { class: "badge wait" }, `${gap.toFixed(1)}% to go`);
  }

  const target = el("input", {
    class: "target", type: "number", step: "0.01", min: "0", placeholder: "Set…",
    title: "Type a price and press Enter",
    onkeydown: e => { if (e.key === "Enter") e.target.blur(); },
    onchange: e => saveTarget(item, e.target.value),
  });
  if (item.target_price != null) target.value = item.target_price;

  return el("tr", {},
    el("td", {}, el("button", { class: "symbtn", title: "Show chart", onclick: () => openDetail(item) }, s.symbol), s.name ? el("div", { class: "name" }, s.name) : null,
      item.notes ? el("div", { class: "name" }, "📝 " + item.notes) : null),
    el("td", { class: "num" }, money(s.current_price)),
    changeCell,
    sparkCell(s),
    el("td", { class: "num" }, target),
    el("td", {}, status),
    el("td", {}, el("button", { class: "btn ghost", onclick: () => removeItem(item) }, "Remove")));
}

// ---------- Charts ----------

const SVG_NS = "http://www.w3.org/2000/svg";
function svg(tag, attrs = {}) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
}

const historyCache = new Map();
async function getHistory(stockId, range) {
  const key = stockId + ":" + range;
  const hit = historyCache.get(key);
  if (hit && Date.now() - hit.at < 10 * 60 * 1000) return hit.points;
  const data = await api(`/stocks/${stockId}/history/?range=${range}`);
  historyCache.set(key, { at: Date.now(), points: data.points });
  return data.points;
}

function pct(a, b) { return (b / a - 1) * 100; }
function signed(n) { return (n >= 0 ? "+" : "") + n.toFixed(1) + "%"; }
function shortDate(d, withYear) {
  return new Date(d + "T00:00:00").toLocaleDateString(undefined,
    withYear ? { month: "short", day: "numeric", year: "numeric" } : { month: "short", day: "numeric" });
}

function sparkCell(stock) {
  const td = el("td", { class: "spark" }, "…");
  getHistory(stock.id, "1mo").then(points => {
    if (points.length < 2) { td.textContent = "—"; return; }
    const W = 96, H = 28, P = 2;
    const ys = points.map(p => p.close);
    const min = Math.min(...ys), span = (Math.max(...ys) - min) || 1;
    const coords = ys.map((v, i) =>
      `${(P + i * (W - 2 * P) / (ys.length - 1)).toFixed(1)},${(H - P - (v - min) / span * (H - 2 * P)).toFixed(1)}`);
    const change = pct(ys[0], ys[ys.length - 1]);
    const label = `Last 30 days: ${signed(change)}`;
    const chart = svg("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img", "aria-label": label });
    chart.append(svg("polyline", {
      points: coords.join(" "), fill: "none", stroke: change >= 0 ? "var(--up)" : "var(--down)",
      "stroke-width": "1.5", "stroke-linejoin": "round", "stroke-linecap": "round",
    }));
    const title = svg("title"); title.textContent = label; chart.append(title);
    td.replaceChildren(chart);
  }).catch(() => { td.textContent = "—"; });
  return td;
}

function niceTicks(min, max, count) {
  const raw = (max - min) / count;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const ticks = [];
  for (let t = Math.ceil(min / step) * step; t <= max + 1e-9; t += step) ticks.push(+t.toFixed(10));
  return ticks;
}

function openDetail(item) {
  const s = item.stock_detail;
  detail = { stockId: s.id, symbol: s.symbol, name: s.name, target: item.target_price, range: detail?.range || "6mo" };
  renderDetail();
  document.getElementById("detail").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

async function renderDetail() {
  const box = document.getElementById("detail");
  if (!box || !detail) return;
  const d = detail;
  const RANGES = [["1mo", "1M", "month"], ["6mo", "6M", "6 months"], ["1y", "1Y", "year"]];
  const sub = el("div", { class: "sub" }, "Loading…");
  const chartWrap = el("div", { class: "chart-wrap" });
  box.className = "detail";
  box.replaceChildren(
    el("div", { class: "detail-head" },
      el("div", {}, el("div", { class: "title" }, el("strong", {}, d.symbol), d.name ? " · " + d.name : ""), sub),
      el("div", { class: "ranges" },
        ...RANGES.map(([r, label]) => el("button", {
          class: "chip" + (r === d.range ? " active" : ""),
          onclick: () => { d.range = r; renderDetail(); },
        }, label)),
        el("button", { class: "btn ghost", onclick: () => { detail = null; box.replaceChildren(); box.className = ""; } }, "Close"))),
    chartWrap);

  let points;
  try { points = await getHistory(d.stockId, d.range); }
  catch (err) { sub.textContent = err.message; return; }
  if (detail !== d) return;  // closed or switched while loading
  if (points.length < 2) { sub.textContent = "No price history found for this symbol."; return; }

  const change = pct(points[0].close, points[points.length - 1].close);
  const period = RANGES.find(([r]) => r === d.range)[2];
  sub.replaceChildren(el("span", { class: change >= 0 ? "up" : "down" }, (change >= 0 ? "▲ " : "▼ ") + signed(change)),
    ` over the last ${period}`);
  drawChart(chartWrap, points, d.target == null ? null : Number(d.target), d.range === "1y");

  const rows = [...points].reverse().map(p => el("tr", {},
    el("td", {}, shortDate(p.date, true)), el("td", { class: "num" }, money(p.close))));
  box.append(el("details", { class: "data" }, el("summary", {}, "Show these prices as a table"),
    el("div", { class: "scroll" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "Date"), el("th", { class: "num" }, "Close"))),
      el("tbody", {}, ...rows)))));
}

function drawChart(wrap, points, target, withYear) {
  const W = Math.max(wrap.clientWidth, 280), H = 260;
  const m = { top: 14, right: 14, bottom: 28, left: 60 };
  const ys = points.map(p => p.close);
  let min = Math.min(...ys), max = Math.max(...ys);
  if (target != null) { min = Math.min(min, target); max = Math.max(max, target); }
  const pad = (max - min) * 0.08 || 1;
  min -= pad; max += pad;
  const x = i => m.left + i * (W - m.left - m.right) / (points.length - 1);
  const y = v => m.top + (max - v) / (max - min) * (H - m.top - m.bottom);

  const chart = svg("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: "chart", role: "img",
    "aria-label": `${detail.symbol} closing prices from ${shortDate(points[0].date, true)} to ${shortDate(points[points.length - 1].date, true)}` });

  for (const t of niceTicks(min, max, 4)) {
    chart.append(svg("line", { class: "grid", x1: m.left, x2: W - m.right, y1: y(t), y2: y(t) }));
    const label = svg("text", { x: m.left - 8, y: y(t) + 4, "text-anchor": "end" });
    label.textContent = money(t);
    chart.append(label);
  }
  for (const i of [0, Math.floor((points.length - 1) / 2), points.length - 1]) {
    const label = svg("text", { x: x(i), y: H - 8, "text-anchor": i === 0 ? "start" : i === points.length - 1 ? "end" : "middle" });
    label.textContent = shortDate(points[i].date, withYear);
    chart.append(label);
  }

  if (target != null) {
    chart.append(svg("line", { class: "target", x1: m.left, x2: W - m.right, y1: y(target), y2: y(target) }));
    const label = svg("text", { class: "target-label", x: W - m.right, y: y(target) - 6, "text-anchor": "end" });
    label.textContent = "Your target " + money(target);
    chart.append(label);
  }

  chart.append(svg("path", { class: "line", d: ys.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("") }));

  const cross = svg("line", { class: "cross", y1: m.top, y2: H - m.bottom, visibility: "hidden" });
  const dot = svg("circle", { class: "dot", r: 5, visibility: "hidden" });
  const hit = svg("rect", { class: "hit", x: m.left, y: 0, width: W - m.left - m.right, height: H, tabindex: 0,
    "aria-label": "Use left and right arrow keys to read prices" });
  chart.append(cross, dot, hit);
  const tip = el("div", { class: "tip" });
  tip.hidden = true;

  let current = null;
  function show(i) {
    current = Math.max(0, Math.min(points.length - 1, i));
    const px = x(current), py = y(points[current].close);
    for (const [k, v] of [["x1", px], ["x2", px]]) cross.setAttribute(k, v);
    dot.setAttribute("cx", px); dot.setAttribute("cy", py);
    cross.setAttribute("visibility", "visible"); dot.setAttribute("visibility", "visible");
    tip.replaceChildren(shortDate(points[current].date, true) + "  ", el("b", {}, money(points[current].close)));
    tip.hidden = false;
    const scale = chart.getBoundingClientRect().width / W;
    tip.style.left = Math.min(Math.max(px * scale, 70), wrap.clientWidth - 70) + "px";
    tip.style.top = (py * scale - 10) + "px";
  }
  function hide() {
    cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden");
    tip.hidden = true; current = null;
  }
  hit.addEventListener("pointermove", e => {
    const rect = chart.getBoundingClientRect();
    const px = (e.clientX - rect.left) * W / rect.width;
    show(Math.round((px - m.left) / (W - m.left - m.right) * (points.length - 1)));
  });
  hit.addEventListener("pointerleave", hide);
  hit.addEventListener("blur", hide);
  hit.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      show((current ?? points.length - 1) + (e.key === "ArrowRight" ? 1 : -1));
    }
  });

  wrap.replaceChildren(chart, tip);
}

async function run(action, okText) {
  try {
    await action();
    if (okText) setFlash(okText, "ok");
  } catch (err) {
    setFlash(err.message);
  }
  await loadLists();
  await renderMain();
}

document.getElementById("new-list").addEventListener("submit", e => {
  e.preventDefault();
  const input = document.getElementById("new-list-name");
  run(async () => {
    const wl = await api("/watchlists/", { method: "POST", body: JSON.stringify({ name: input.value }) });
    currentId = wl.id;
    input.value = "";
  });
});

function addExample() {
  const existing = lists.find(l => l.name === "Popular stocks");
  if (existing) {
    setFlash("You already have the Popular stocks list — here it is.", "ok");
    select(existing.id);
    return;
  }
  run(async () => {
    const wl = await api("/watchlists/example/", { method: "POST" });
    currentId = wl.id;
  }, "Added an example list of 10 popular stocks. Edit or delete it any time.");
}
document.getElementById("add-example").addEventListener("click", addExample);

function addStock(e, watchlistId) {
  e.preventDefault();
  const f = e.target;
  const symbol = f.symbol.value.trim().toUpperCase();
  run(async () => {
    const found = await api(`/stocks/?symbol=${encodeURIComponent(symbol)}`);
    const stock = found.results[0] || await api("/stocks/", { method: "POST", body: JSON.stringify({ symbol }) });
    const body = { watchlist: watchlistId, stock: stock.id, notes: f.notes.value };
    if (f.target.value) body.target_price = f.target.value;
    try {
      await api("/items/", { method: "POST", body: JSON.stringify(body) });
    } catch (err) {
      if (/unique/i.test(err.message)) throw new Error(`${symbol} is already on this list.`);
      throw err;
    }
  }, `Added ${symbol}.`);
}

function saveTarget(item, value) {
  run(() => api(`/items/${item.id}/`, {
    method: "PATCH", body: JSON.stringify({ target_price: value === "" ? null : value }),
  }), value === "" ? "Target removed." : "Target saved.");
}

function removeItem(item) {
  run(() => api(`/items/${item.id}/`, { method: "DELETE" }), `Removed ${item.stock_detail.symbol}.`);
}

function deleteList(wl) {
  const main = document.getElementById("main");
  if (main.querySelector(".confirm")) return;
  const box = el("div", { class: "msg error confirm" },
    `Delete “${wl.name}” and everything on it? `,
    el("button", { class: "btn", onclick: () => run(() => api(`/watchlists/${wl.id}/`, { method: "DELETE" }), "List deleted.") }, "Yes, delete"),
    " ",
    el("button", { class: "btn ghost", onclick: () => box.remove() }, "Cancel"));
  main.prepend(box);
}

(async () => {
  try { await loadLists(); await renderMain(); }
  catch (err) { setFlash("Couldn't reach the server. Is it running?"); await renderMain().catch(() => {}); }
  setInterval(() => {
    if (document.activeElement && document.activeElement.tagName === "INPUT") return;
    renderMain().catch(() => {});
  }, 60000);
})();
</script>
{% endblock %}
